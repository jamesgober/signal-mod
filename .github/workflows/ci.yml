name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Lints are deny-by-default, so the lint toolchain is pinned (and
  # bumped deliberately, together with rust-toolchain.toml) instead of
  # floating with every stable release. RUSTUP_TOOLCHAIN overrides
  # rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is aarch64 Linux; macos-latest is Apple Silicon.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - name: default
            flags: ""
          - name: all-features
            flags: "--all-features"
          - name: no-default-features
            flags: "--no-default-features"
        name: [default, all-features, no-default-features]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Clippy (pedantic)
        shell: bash
        run: cargo clippy --locked --all-targets ${{ matrix.flags }} -- -D warnings -W clippy::pedantic
      # Includes tests/real_signals.rs: real SIGUSR1 / SIGUSR2 / SIGHUP /
      # SIGTERM / SIGINT / SIGPIPE on Unix and CTRL_BREAK on Windows,
      # delivered to child processes.
      - name: Test
        shell: bash
        run: cargo test --locked ${{ matrix.flags }}

  features:
    name: Each feature alone (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy and test every feature on its own
        shell: bash
        run: |
          set -euo pipefail
          for f in std tokio agnostic smol ctrlc-fallback async-std tracing tokio-util "std,tokio,tracing,tokio-util"; do
            echo "::group::--features $f"
            cargo clippy --locked --all-targets --no-default-features --features "$f" -- -D warnings -W clippy::pedantic
            cargo test --locked --no-default-features --features "$f"
            echo "::endgroup::"
          done

  cross:
    name: Cross-target check (library)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-apple-darwin
          - i686-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (library, every back-end)
        run: |
          set -euo pipefail
          for f in "" "--all-features" "--no-default-features --features std,agnostic" "--no-default-features"; do
            cargo clippy --locked --lib --target ${{ matrix.target }} $f -- -D warnings -W clippy::pedantic
          done

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      # The library (what downstream users build) for every back-end.
      # Dev-dependencies are excluded: the benchmark harness needs 1.86.
      - name: Check library on the MSRV
        run: |
          set -euo pipefail
          for f in "" "--all-features" "--no-default-features" "--no-default-features --features std,agnostic" "--no-default-features --features std,tokio"; do
            cargo check --locked --lib $f
          done

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc (stable, all features)
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - uses: dtolnay/rust-toolchain@nightly
      - name: rustdoc (docs.rs configuration)
        run: cargo doc --locked --all-features --no-deps
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

  loom:
    name: Loom (state machine model check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@v2
      - name: Loom
        run: cargo test --lib --release --no-default-features --features std loom
        env:
          RUSTFLAGS: "--cfg loom"

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # `--target` keeps the sanitizer flags off build scripts and proc
      # macros; `-Zbuild-std` instruments the standard library too.
      - name: ASan
        run: >-
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu
          --all-features --lib --tests
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: "detect_leaks=1"

  semver:
    name: SemVer (cargo-semver-checks)
    runs-on: ubuntu-latest
    # The action installs and uses its own (current stable) toolchain.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6
      # The baseline is the latest release on crates.io. Against a 1.x
      # baseline (only while 2.0.0 is unreleased) the check is limited to
      # the features both lines share: 1.0.0's `async-std` feature pulls
      # rustix 0.37, which no longer builds on current stable, and a major
      # bump skips every check anyway. From 2.0.0 on, every feature is
      # compared.
      - name: Choose the baseline feature set
        id: baseline
        run: |
          latest=$(curl -fsSL -H "User-Agent: signal-mod-ci (github.com/jamesgober/signal-mod)"             https://crates.io/api/v1/crates/signal-mod | jq -r .crate.max_stable_version)
          echo "latest published: $latest"
          echo "major=${latest%%.*}" >> "$GITHUB_OUTPUT"
      - name: cargo-semver-checks (1.x baseline, shared features)
        if: steps.baseline.outputs.major == '1'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: only-explicit-features
          features: std,tokio,ctrlc-fallback
      - name: cargo-semver-checks (all features)
        if: steps.baseline.outputs.major != '1'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Audit (committed lockfile)
        run: cargo audit
      - name: Deny
        run: cargo deny check
      # What a new downstream user would resolve today.
      - name: Audit (fresh resolution)
        run: |
          cargo generate-lockfile
          cargo audit
